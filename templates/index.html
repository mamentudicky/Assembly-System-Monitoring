<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced System Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            border-left: 4px solid var(--accent);
            padding-left: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 1.8rem; font-weight: 600; }
        p.subtitle { color: var(--text-dim); font-size: 0.9rem; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            margin-bottom: 1rem;
        }

        .value {
            font-size: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
        }

        .mem-details {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-dim);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            padding: 10px;
            color: var(--text-dim);
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        td {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-family: 'JetBrains Mono', monospace;
        }

        .btn-system {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-system:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            filter: brightness(1.1);
        }

        .btn-system:active {
            transform: translateY(1px);
        }

        #error-msg {
            background: #ef4444;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="error-msg"></div>
        <header>
            <div>
                <h1>System Monitoring Dashboard</h1>
                <p class="subtitle">Real-time data from Assembly & Python Pipeline</p>
            </div>
            <button class="btn-system" id="deep-refresh-btn" onclick="deepRefreshSystem()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
                Deep Refresh & Reset System
            </button>
        </header>

        <div class="grid">
            <div class="card">
                <h2>Uptime (Current Session)</h2>
                <div id="uptime" class="value">0d 0h 0m 0s</div>
            </div>

            <div class="card">
                <h2>CPU Usage</h2>
                <div id="cpu" class="value">Loading...</div>
                <div id="cpu-bar" style="height: 4px; background: #334155; margin-top: 10px; border-radius: 2px; overflow: hidden;">
                    <div id="cpu-fill" style="height: 100%; background: var(--accent); width: 0%; transition: width 0.5s;"></div>
                </div>
            </div>

            <div class="card">
                <h2>Memory Info</h2>
                <div id="mem-main" class="value">Loading...</div>
                <div class="mem-details">
                    <span>Total: <b id="mem-total">-</b></span>
                    <span>Free: <b id="mem-free">-</b></span>
                    <span>Used: <b id="mem-used-val">-</b></span>
                    <span>Cached: <b id="mem-cache">-</b></span>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Top Processes</h2>
            <table>
                <thead>
                    <tr>
                        <th>PID</th>
                        <th>Name</th>
                        <th>Memory Usage</th>
                    </tr>
                </thead>
                <tbody id="proc-table">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let sessionStartTime = Date.now();

        async function deepRefreshSystem() {
            const btn = document.getElementById('deep-refresh-btn');
            const originalHTML = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = 'Optimizing System...';
            btn.style.background = 'var(--warning)';

            try {
                // 1. Panggil API backend untuk membersihkan cache
                const response = await fetch('/refresh_system', { method: 'POST' });
                const result = await response.json();
                
                if (result.status === 'success') {
                    // 2. Reset Uptime
                    sessionStartTime = Date.now();
                    
                    // 3. Update data segera
                    await updateData();
                    
                    btn.innerHTML = 'System Optimized!';
                    btn.style.background = 'var(--success)';
                } else {
                    alert('Error resetting system: ' + result.message);
                }
            } catch (err) {
                console.error(err);
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                    btn.style.background = '';
                }, 2000);
            }
        }

        function formatDuration(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let days = Math.floor(totalSeconds / (24 * 3600));
            totalSeconds %= (24 * 3600);
            let hours = Math.floor(totalSeconds / 3600);
            totalSeconds %= 3600;
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;
            return `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        async function updateData() {
            try {
                const res = await fetch('/data');
                const data = await res.json();
                
                if (data.error) {
                    document.getElementById('error-msg').innerText = data.error;
                    document.getElementById('error-msg').style.display = 'block';
                    return;
                }
                
                document.getElementById('error-msg').style.display = 'none';
                
                const elapsed = Date.now() - sessionStartTime;
                document.getElementById('uptime').innerText = formatDuration(elapsed);
                
                document.getElementById('cpu').innerText = data.cpu_detail.split('(')[0];
                const cpuPct = parseFloat(data.cpu_detail);
                document.getElementById('cpu-fill').style.width = cpuPct + '%';

                document.getElementById('mem-main').innerText = data.mem_used + ' MB Used';
                document.getElementById('mem-total').innerText = data.mem_total + ' MB';
                document.getElementById('mem-free').innerText = data.mem_free + ' MB';
                document.getElementById('mem-used-val').innerText = data.mem_used + ' MB';
                document.getElementById('mem-cache').innerText = data.mem_cached + ' MB';

                let procHtml = '';
                data.processes.forEach(p => {
                    procHtml += `<tr><td>${p.pid}</td><td>${p.name}</td><td>${p.mem} MB</td></tr>`;
                });
                document.getElementById('proc-table').innerHTML = procHtml;
            } catch (err) {
                console.error(err);
            }
        }

        setInterval(updateData, 2000);
        updateData();
    </script>
</body>
</html>
